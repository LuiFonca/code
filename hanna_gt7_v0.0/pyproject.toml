[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanna-gt7"
version = "0.1.0"
description = "GT7 Professional Telemetry Platform — telemetria, analytics e race engineer"
requires-python = ">=3.11"

# O núcleo depende SÓ de pycryptodome (Salsa20 do protocolo GT7).
# Nada de Qt aqui: é isso que permite rodar gt7core headless.
dependencies = [
    "pycryptodome>=3.19,<4",
]

[project.optional-dependencies]
app = ["PySide6>=6.6,<7"]
storage = ["pyarrow>=15"]
ai = ["anthropic>=0.40"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["gt7core*", "gt7app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["gt7core"]
strict = true
