[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanna-gt7"
version = "0.1.0"
description = "GT7 Professional Telemetry Platform — telemetria, analytics e race engineer"
requires-python = ">=3.11"

# O núcleo depende SÓ de pycryptodome (Salsa20 do protocolo GT7).
# Nada de Qt aqui: é isso que permite rodar gt7core headless.
dependencies = [
    "pycryptodome>=3.19,<4",
]

[project.optional-dependencies]
app = ["PySide6>=6.6,<7"]
storage = ["pyarrow>=15"]
# `output_config` (esforço e saída estruturada) só existe a partir da 0.120.
# Um piso mais baixo instalaria uma SDK que rejeita o parâmetro em TypeError.
ai = ["anthropic>=0.120"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["gt7core*", "gt7app*", "gt7ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["gt7core", "gt7app", "gt7ai"]
strict = true

# O PySide6 não publica stubs completos; sem isto, cada import de Qt vira erro
# e o strict fica inutilizável justamente na camada que mais precisa dele.
[[tool.mypy.overrides]]
module = "PySide6.*"
ignore_missing_imports = true
